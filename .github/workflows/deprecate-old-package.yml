name: Deprecate old package

on:
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - run: npm deprecate "@creative-dswork/dsh-mcp-apps@*" "Renamed to @creative-dswork/dsh-uni-editor. Install the new package instead."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
